<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Potwierdź konto — SMARTCART</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#F7F7F2;font-family:Arial,sans-serif;color:#152D43;">
    <div style="max-width:480px;margin:0 auto;padding:24px;background-color:#FFFFFF;border-radius:16px;">
      <p style="color:#07966D;font-weight:bold;">SMARTCART</p>
      <h1 style="font-size:24px;">Potwierdź swój adres email</h1>
      <p>Wpisz poniższy kod na ekranie potwierdzania rejestracji w aplikacji SMARTCART:</p>
      <p style="font-family:monospace;font-size:32px;font-weight:bold;letter-spacing:4px;">{{ .Token }}</p>
      <p>Kod jest ważny przez 10 minut od wysłania i można go użyć tylko raz.</p>
      <p>Jeśli nie rejestrowano konta na ten adres, zignoruj tę wiadomość.</p>
    </div>
  </body>
</html>
